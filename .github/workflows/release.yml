# Build the plugin zip and publish it as a GitHub Release.
#
# Triggered by pushing a version tag:
#
#     git tag v3.27.0 && git push origin v3.27.0
#
# The tag must match `version=` in equis_loader/metadata.txt, so a release
# can never carry a zip that reports a different version than its name.
# Only the suites that need neither QGIS nor DuckDB run here (checked in a
# bare venv, 2026-10-14); test_offline.py and test_store_parity.py stay local.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Node 24 releases: the v4/v5 pair runs on Node 20, which GitHub has
      # deprecated and was already forcing onto 24 (the v3.32.0 run warned).
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Tag matches metadata.txt
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python - <<'PY'
          import configparser
          # interpolation=None: the changelog has bare % signs (see package.py).
          p = configparser.ConfigParser(interpolation=None); p.optionxform = str
          p.read("equis_loader/metadata.txt", encoding="utf-8")
          print(p["general"]["version"].strip())
          PY
          )"
          echo "tag=$tag metadata=$version"
          test "$tag" = "$version" || {
            echo "::error::tag v$tag does not match metadata.txt version $version"
            exit 1
          }

      - name: Tests that need no QGIS
        run: |
          python tools/test_parsing.py
          python tools/test_state.py
          python tools/test_live.py
          python tools/test_tasks.py
          python tools/test_overlay_payload.py

      - name: Build zip
        run: python tools/package.py

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

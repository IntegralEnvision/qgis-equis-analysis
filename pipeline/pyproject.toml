# The QGIS plugin's parquet source, installable from a git subdirectory and
# never published to an index. Elsewhere, always pinned to a commit:
#   pip install "git+https://github.com/IntegralEnvision/qgis-equis-analysis@<commit>#subdirectory=pipeline"
# From a checkout: pip install -e pipeline (or run the scripts by path).

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "parquet-source"
version = "0.1.0"
description = "The QGIS EQuIS plugin's parquet source: a facility's results as partitioned parquet and a published manifest"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["pyarrow", "numpy"]

[project.optional-dependencies]
# A CRS other than EPSG:4326 for the ArcGIS output, without a PROJJSON file.
crs = ["pyproj"]
# ChemDuck's sidecars (chemduck_sidecars.py), for a facility whose
# pipeline.json has a "chemduck" section. The vendored ChemDuck's own needs;
# it refuses a DuckDB outside its SUPPORTED_DUCKDB.
chemduck = ["duckdb>=1.5.4", "pyyaml>=6.0"]

[tool.setuptools]
# parquet_source.chemduck is ChemDuck, vendored at the plugin's pin by the
# repository's tools/vendor_chemduck.py; never edited here.
packages = ["parquet_source", "parquet_source.chemduck"]

[tool.setuptools.package-data]
"parquet_source.chemduck" = ["sql/*.sql", "sql/optional/*.sql", "*.yaml", "VENDORED.json"]

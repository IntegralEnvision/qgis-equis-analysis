<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EQuIS linked views</title>
<!--
  Served by equis_loader/web_assets.py over equis://, NOT file:// - a file
  URL forbids the ES module import below, which is the whole reason the
  custom scheme exists.

  qwebchannel.js is injected by Qt into any page on a profile that has a
  channel. It is not an npm package and must not be bundled; app.js expects
  the global it defines to already be there.
-->
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: transparent;
    font: 12px/1.4 system-ui, "Segoe UI", sans-serif;
    color: #1a1a1a;
  }
  #status {
    position: absolute; left: 8px; bottom: 6px;
    padding: 2px 6px; border-radius: 3px;
    background: rgba(255, 255, 255, 0.82);
    color: #444; font-size: 11px;
  }
  /* A column: the chooser on top, the chart taking the rest. #views needs a
     real height - the scatter sizes itself square from what it is given,
     and an element that only wraps its content offers nothing to fit. */
  body { display: flex; flex-direction: column; }
  #controls { flex: none; padding: 6px 6px 0; }
  #controls[hidden] { display: none; }
  #views { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 4px 6px; }
  /* Label beside control, labels in one column so the boxes line up
     (asked 2026-10-12). Three rows: Matrix + filter, X + swap, Y. */
  .chooser { display: grid; grid-template-columns: auto minmax(0, 1fr) auto;
             gap: 3px 6px; align-items: center; }
  .chooser-label { grid-column: 1; font-size: 11px; color: #555;
                   text-align: right; cursor: default; }
  .chooser-pair { display: flex; gap: 6px; min-width: 0; }
  .chooser-pair select { flex: 1 1 60%; min-width: 0; }
  .chooser-pair input { flex: 1 1 40%; min-width: 0; }
  .chooser .axis-select { grid-column: 2; min-width: 0; }
  .chooser select, .chooser input { font: inherit; font-size: 12px;
                                    box-sizing: border-box; padding: 1px 3px;
                                    height: 22px; }
  /* The matrix row has no button; X's swap spans X and Y. */
  .chooser-pair { grid-column: 2 / span 2; }
  .chooser .swap { grid-column: 3; grid-row: 2 / span 2; align-self: center;
                   font: inherit; padding: 0 6px; height: 22px; cursor: pointer; }
  .chooser-line { position: relative; font-size: 11px; color: #555;
                  padding: 3px 0 4px; border-bottom: 1px solid #dde2e7;
                  display: flex; flex-wrap: wrap; gap: 0 10px; align-items: baseline; }
  .chooser-status.working::before {
    content: ""; display: inline-block; width: 10px; height: 10px;
    margin-right: 6px; vertical-align: -1px;
    border: 2px solid #cfd6de; border-top-color: #3b6ea8; border-radius: 50%;
    animation: spin 0.8s linear infinite; }
  .chooser-warn { font: inherit; font-size: 11px; color: #a05a00; background: none;
                  border: none; padding: 0; cursor: pointer; }
  /* OVER the chart, not above it: opening the list never moves the plot. */
  .chooser-warn-panel { position: absolute; top: 100%; left: 0; right: 0;
                        z-index: 10; max-height: 45vh; overflow: auto;
                        background: #fffdf7; border: 1px solid #d9c48a;
                        border-radius: 3px; padding: 6px 8px;
                        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.18); }
  .chooser-warn-advice { color: #6b5a2e; margin-bottom: 4px; }
  .chooser-warn-panel ul { margin: 0; padding-left: 16px; }
  .chooser-warn[hidden], .chooser-warn-panel[hidden], #status[hidden] { display: none; }
  .legend { font-size: 11px; margin: 2px 0; display: flex; gap: 10px;
            align-items: center; }
  .bikey-note { font-size: 11px; color: #555; max-width: 34em; }
  .caption, .brush, .note { font-size: 11px; color: #444; margin: 2px 0; }
  /* Visible from the first paint, before app.js (600 KB) has even loaded:
     Chromium's start and the bundle's parse are the longest silent wait,
     measured at several seconds on a first open. */
  .busy { display: flex; align-items: center; gap: 10px; padding: 16px 8px;
          color: #444; font-size: 13px; }
  .busy::before { content: ""; width: 18px; height: 18px; flex: none;
                  border: 2px solid #cfd6de; border-top-color: #3b6ea8;
                  border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .idle { padding: 16px 8px; color: #777; font-size: 12px; }
  /* The linked views (linked.js): small multiples under the chart, the
     chrome kept to a line so the marks get the pixels. */
  .linked { margin-top: 4px; }
  .linked-line { font-size: 11px; color: #444; margin: 0 0 3px; }
  .linked-line .brush { margin: 0; }
  .linked-hists { display: flex; flex-wrap: wrap; gap: 6px; }
  .card { background: var(--card, transparent); border-radius: 4px; }
  .box-card { margin-top: 6px; }
  .box-bar { display: flex; gap: 6px; align-items: center; margin-bottom: 2px; }
  .box-bar select { font: inherit; font-size: 11px; height: 20px; padding: 0 2px; }
  .box-head { font-size: 11px; color: #555; margin: 1px 0 2px; }
  .box-area { max-height: 48vh; overflow-y: auto; overflow-x: hidden; }
  svg.boxes text { font-size: 10px; fill: #333; }
  svg.boxes .box-label.dim { fill: #aaa; }
  svg.boxes .box-note, svg.boxes .box-tick { fill: #777; }
  svg.boxes .box-lt { fill: #3b6ea8; font-weight: 600; }
  svg.boxes .box-lt.faint { fill: #b5bcc4; }
  svg.boxes .box-row:hover rect:first-of-type { fill: rgba(59, 110, 168, 0.07); }
  /* THE PANELS (shell.js). In the tab they are one scrolling column with
     no headers - the tab as it was. Over the map (map_overlay.py) each is
     a translucent card that clings to an edge; only cards are painted and
     only cards get the mouse - the host gates it by the rectangles app.js
     reports, so these boxes ARE the hit areas. */
  #shell { flex: 1 1 auto; min-height: 0; overflow: auto; }
  #shell #views { overflow: visible; }
  .panel-head { display: none; }
  #p-data { display: none; }
  .panel:has(> .panel-body:empty), #p-choose:has(#controls[hidden]) { display: none !important; }
  body.overlay { display: block; overflow: hidden; }
  body.overlay #shell { overflow: visible; }
  body.overlay .panel {
    position: absolute; box-sizing: border-box; display: flex; flex-direction: column;
    max-height: calc(100vh - 16px - var(--inset-v, 0px)); background: rgba(255, 255, 255, 0.76);
    border-radius: 6px; box-shadow: 0 1px 6px rgba(0, 0, 0, 0.28); }
  body.overlay .panel.snapping { transition: left 0.16s ease-out, top 0.16s ease-out; }
  body.overlay .panel.dragging { opacity: 0.85; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35); }
  body.overlay .panel-body { overflow: auto; min-height: 0; padding: 2px 6px 6px; }
  body.overlay .panel-head {
    display: flex; align-items: center; gap: 6px; flex: none; cursor: grab;
    padding: 2px 4px 2px 8px; font-size: 11px; color: #555; user-select: none;
    touch-action: none; border-bottom: 1px solid rgba(0, 0, 0, 0.07); }
  body.overlay .panel.dragging .panel-head { cursor: grabbing; }
  .panel-title { flex: 1; font-weight: 600; letter-spacing: 0.02em; }
  .panel-min { font: inherit; border: none; background: none; cursor: pointer;
               color: #777; padding: 0 4px; line-height: 1; font-size: 14px; }
  body.overlay #p-data { display: flex; width: 300px; }
  body.overlay #p-choose { width: min(430px, 46vw); }
  body.overlay #p-chart { width: min(430px, 46vw); }
  body.overlay #p-hists { width: min(390px, 40vw); }
  body.overlay #p-box { width: min(390px, 40vw); }
  /* Minimised: the header alone, as a tab against the edge - upright on
     the top and bottom, turned on the left and right. */
  body.overlay .panel.minimized { width: auto !important; }
  body.overlay .panel.minimized > .panel-body { display: none; }
  body.overlay .panel.minimized .panel-min { display: none; }
  body.overlay .panel.minimized .panel-head { cursor: pointer; border: none; padding: 4px 8px; }
  body.overlay .panel.minimized.edge-left .panel-head,
  body.overlay .panel.minimized.edge-right .panel-head { writing-mode: vertical-rl; padding: 8px 3px; }
  body.overlay .panel.minimized.edge-left .panel-head { transform: rotate(180deg); }
  body.overlay .card.main .caption ~ .caption,
  body.overlay .bikey-note { display: none; }
  body.overlay .box-area { max-height: 40vh; }
  /* The Data panel: what is loaded, and the warnings the panel's banner
     carries (cached, offline, cut short) - CLAUDE.md: marked everywhere. */
  .data-what { font-size: 12px; margin: 2px 0; }
  .data-source { color: #777; font-size: 11px; }
  .data-banner { font-size: 11px; margin: 4px 0; padding: 4px 6px; border-radius: 3px;
                 background: #fdf6e3; border: 1px solid #d9c48a; color: #6b5a2e;
                 white-space: pre-line; }
  .data-status { font-size: 11px; margin: 3px 0; }
  .data-status.warning { color: #b36b00; } .data-status.critical { color: #b00020; }
  .data-status.success { color: #1b7f33; }
  .data-actions { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
  .data-actions button { font: inherit; font-size: 11px; height: 22px; padding: 0 8px; cursor: pointer; }
  .data-hint { font-size: 10px; color: #888; margin-top: 4px; }
</style>
</head>
<body>
  <div id="shell">
    <section class="panel" id="p-data" data-title="Data"><div class="panel-body" id="data-body"></div></section>
    <section class="panel" id="p-choose" data-title="Choose"><div class="panel-body"><div id="controls" hidden></div></div></section>
    <section class="panel" id="p-chart" data-title="Chart"><div class="panel-body"><div id="views"><div class="busy">Starting the chart engine…</div></div></div></section>
    <section class="panel" id="p-hists" data-title="Histograms"><div class="panel-body" id="linked-hists"></div></section>
    <section class="panel" id="p-box" data-title="Box plot"><div class="panel-body" id="linked-box"></div></section>
  </div>
  <div id="status">starting…</div>
  <script type="module" src="app.js"></script>
</body>
</html>
